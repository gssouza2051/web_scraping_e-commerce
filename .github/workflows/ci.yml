name: CI

on:
  push:
  pull_request:

jobs:
  validar-scraping:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            1_scraping_setup/requirements.txt
            3_airflow/requirements.txt

      - name: Instalar dependencias do scraping
        run: |
          python -m pip install --upgrade pip
          pip install -r 1_scraping_setup/requirements.txt

      - name: Validar imports do scraping
        run: |
          PYTHONPATH=1_scraping_setup python -c "import main, banco_postgres; print('imports_ok')"

      - name: Validar sintaxe Python
        run: |
          python -m compileall 1_scraping_setup 2_data_warehouse 3_airflow

      - name: Validar arquivos Docker Compose
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          caminhos = [
              Path("1_scraping_setup/docker-compose.yml"),
              Path("3_airflow/docker-compose.override.yml"),
          ]

          for caminho in caminhos:
              with caminho.open("r", encoding="utf-8") as arquivo:
                  yaml.safe_load(arquivo)
              print(f"yaml_ok={caminho}")
          PY

  validar-dbt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            1_scraping_setup/requirements.txt

      - name: Instalar dependencias do dbt
        run: |
          python -m pip install --upgrade pip
          pip install -r 1_scraping_setup/requirements.txt

      - name: Instalar pacotes dbt
        working-directory: 2_data_warehouse/dw_e_commerce
        run: |
          dbt deps --profiles-dir .

      - name: Validar parse do dbt
        working-directory: 2_data_warehouse/dw_e_commerce
        run: |
          dbt parse --profiles-dir .

      - name: Validar estrutura do projeto dbt
        run: |
          test -f 2_data_warehouse/dw_e_commerce/dbt_project.yml
          test -f 2_data_warehouse/dw_e_commerce/packages.yml
          test -f 2_data_warehouse/dw_e_commerce/profiles.yml
